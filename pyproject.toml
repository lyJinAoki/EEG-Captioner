[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-captioner"
version = "0.1.0"
description = "Feature-grounded EEG captioning with a Dual-Domain encoder"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10", "h5py>=3.8", "PyYAML>=6", "torch>=2.2", "tqdm>=4.65"]

[project.optional-dependencies]
llm = ["transformers>=5.12.1,<5.13", "peft>=0.19,<0.20", "accelerate>=1.15,<2", "safetensors>=0.4"]
preprocess = ["mne>=1.6", "nibabel>=5"]
annotation = ["requests>=2.31"]
dev = ["pytest>=8", "build"]

[project.scripts]
eeg-captioner = "eeg_captioner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eeg_captioner = ["data/*.json", "data/*.jsonl", "features/templates/*.md", "prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
